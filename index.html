<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>TOEIC answer keys</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --text: #111;
    --muted: #5c6570;
    --line: #ddd;
    --header: #f3f3f3;
    --btn: #fff;
    --btn-line: #777;
    --on: #222;
    --on-text: #fff;
    --sel: #ececec;
    --path: #8a8a8a;
    --hint: #555;
    --cell: #fff;
    --badge: #111;
    --badge-text: #fff;
    --hover: #f1f5f9;
    --scrim: rgba(0, 0, 0, 0.38);
  }
  * { box-sizing: border-box; }
  html {
    color-scheme: light dark;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  [hidden] { display: none !important; }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #f3f3f3;
    border-bottom: 1px solid #ccc;
    padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    position: relative;
  }
  #menu {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 40px;
    padding: 0;
    border: 1px solid #777;
    border-radius: 4px;
    background: #fff;
    color: #111;
  }
  #title {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: max-content;
    max-width: calc(100% - 196px);
    margin: 0;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 650;
    line-height: 1.25;
    text-align: center;
    pointer-events: none;
    overflow-wrap: anywhere;
  }
  .sorts { position: relative; z-index: 1; display: flex; flex-shrink: 0; margin-left: auto; }
  .sorts button {
    font-size: 14px;
    padding: 6px 10px;
    min-height: 36px;
    border: 1px solid #777;
    background: #fff;
    color: #111;
  }
  .sorts button:not([hidden]) + button:not([hidden]) { margin-left: -1px; }
  .sorts button.on { background: #222; color: #fff; }
  #az { border-radius: 4px 0 0 4px; }
  #za { border-radius: 0; }
  #find {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 9px;
    border-radius: 0 4px 4px 0;
  }
  #searchbar { padding: 0 2px 8px; }
  #q {
    display: block;
    width: 100%;
    margin: 0;
    padding: 6px 8px;
    min-height: 36px;
    border: 1px solid #777;
    border-radius: 4px;
    background: #fff;
    color: #111;
    font: inherit;
    font-size: 16px;
  }

  #scrim {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.38);
    border: 0;
    padding: 0;
  }
  #drawer {
    position: fixed;
    z-index: 30;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(320px, 84vw);
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #111;
    border-right: 1px solid #ccc;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
    padding-top: env(safe-area-inset-top);
    transform: translateX(-105%);
  }
  .drawer-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    min-height: 48px;
    padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
  }
  .drawer-brand {
    min-width: 0;
    font-size: 15px;
    font-weight: 650;
    line-height: 1.25;
  }
  #close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 40px;
    padding: 0;
    border: 1px solid #777;
    border-radius: 4px;
    background: #fff;
    color: #111;
  }
  #drawer.open { transform: none; }
  @media (prefers-reduced-motion: no-preference) {
    #drawer { transition: transform 0.2s ease; }
  }
  #tree {
    flex: 1;
    overflow: auto;
    padding: 8px 0 12px;
    overscroll-behavior: contain;
  }
  .row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .row.sel { background: #ececec; }
  .row:focus-visible { outline: 2px solid #777; outline-offset: -2px; }
  .chev, .slot {
    flex: 0 0 32px;
    width: 32px;
    text-align: center;
  }
  .chev {
    color: #444;
    font-size: 12px;
  }
  .label {
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 10px 12px 10px 0;
    border: 0;
    background: transparent;
    text-align: left;
    font-weight: 650;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .kids { padding-left: 14px; }
  .note { padding: 6px 12px 8px 32px; color: #666; font-size: 13px; }
  #drawer footer {
    flex-shrink: 0;
    border-top: 1px solid #ddd;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    color: #555;
    font-size: 13px;
    line-height: 1.55;
  }

  main { width: min(720px, 100%); margin: 0 auto; }
  main.wide { width: min(1100px, 100%); }
  .hint { padding: 28px 16px; color: #555; text-align: center; }

  #list { list-style: none; margin: 0; padding: 0; }
  #list > li { border-bottom: 1px solid #ddd; }
  .head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    margin: 0;
    padding: 9px 10px 9px 26px;
    min-height: 44px;
    border: 0;
    background: #fff;
    color: inherit;
    text-align: left;
    position: relative;
    cursor: pointer;
  }
  .head::before {
    content: "\25B8";
    position: absolute;
    left: 8px;
    top: 9px;
    font-weight: 400;
    color: #444;
  }
  li.open .head::before { content: "\25BE"; }
  .head .title { flex: 1; min-width: 0; font-weight: 650; overflow-wrap: anywhere; }
  .head .path {
    flex: 0 1 auto;
    max-width: 48%;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.3;
    color: #8a8a8a;
    text-align: right;
    overflow-wrap: anywhere;
  }
  li.open .head .path { display: none; }
  .body { display: none; padding: 0 10px 8px 26px; }
  li.open .body { display: block; }
  .extra, .ans li { overflow-wrap: anywhere; }
  .extra { padding: 2px 0 4px; font-weight: 650; }
  ul.ans { list-style: disc; margin: 2px 0 0; padding: 0 0 0 1.15em; }
  ul.ans li { border: 0; padding: 2px 0; }
  ul.ans li::marker { color: #111; }
  .empty { padding: 12px 10px; color: #444; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 8px;
  }
  .card {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
    text-align: center;
    cursor: pointer;
  }
  .thumb {
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f3f3;
  }
  .thumb svg, .hero svg { width: 100%; height: 100%; display: block; }
  .card-label {
    padding: 6px 4px 7px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .hero-wrap { padding: 12px 12px 20px; }
  .hero {
    display: block;
    width: min(100%, 520px);
    margin: 0 auto;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .hero svg { height: auto; }
  .tap-hint { margin: 8px 0 0; text-align: center; color: #777; font-size: 13px; }
  .backbar {
    position: sticky;
    top: var(--header-h, 48px);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #f7f7f7;
    border-bottom: 1px solid #ddd;
  }
  .back {
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid #777;
    border-radius: 4px;
    background: #fff;
    font-weight: 650;
    cursor: pointer;
  }
  .answers {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    padding: 8px 8px calc(12px + env(safe-area-inset-bottom));
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    min-width: 0;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--cell);
    line-height: 1;
  }
  .num {
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 19px;
    height: 19px;
    border-radius: 4px;
    background: var(--badge);
    color: var(--badge-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 800;
    font-size: 12px;
    line-height: 1;
  }
  @media (min-width: 480px) {
    .answers { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  }
  @media (min-width: 640px) {
    .answers { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
    .cell { padding: 6px 8px; border-radius: 6px; }
    .num { font-size: 12px; }
    .letter { width: 22px; height: 22px; font-size: 13px; }
  }
  @media (min-width: 900px) {
    .answers { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  }
  @media (hover: hover) {
    .cell:hover { background: var(--hover); }
  }

  @media (max-width: 420px) {
    .sorts button { padding: 6px 7px; }
    #title { max-width: calc(100% - 168px); }
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (orientation: landscape) and (max-height: 520px) {
    .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .thumb { aspect-ratio: auto; height: 72px; }
    .answers { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --text: #eee;
      --muted: #aaa;
      --line: #333;
      --header: #1c1c1c;
      --btn: #1c1c1c;
      --btn-line: #666;
      --on: #eee;
      --on-text: #111;
      --sel: #2a2a2a;
      --path: #9a9a9a;
      --hint: #aaa;
      --cell: #1c1c1c;
      --badge: #eee;
      --badge-text: #111;
      --hover: #2a2a2a;
      --scrim: rgba(0, 0, 0, 0.55);
    }
    html, body { background: #111; color: #eee; }
    header, .backbar { background: #1c1c1c; border-bottom-color: #333; }
    #menu, #close, .sorts button, .back, #q { background: #1c1c1c; color: #eee; border-color: #666; }
    .sorts button.on { background: #eee; color: #111; }
    #drawer { background: #161616; color: #eee; border-right-color: #333; }
    .row.sel { background: #2a2a2a; }
    .chev { color: #bbb; }
    .note, #drawer footer, .hint, .tap-hint, .empty { color: #aaa; }
    #drawer footer { border-top-color: #333; }
    #list > li { border-bottom-color: #333; }
    .head { background: #111; }
    .head::before { color: #bbb; }
    .head .path { color: #9a9a9a; }
    ul.ans li::marker { color: #fff; }
    .card, .cell { background: #1c1c1c; border-color: #333; }
    .thumb { background: #222; }
    .num { color: #aaa; }
    .letter { background: #eee; color: #111; }
    .cell:hover { background: #2a2a2a; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button type="button" id="menu" aria-label="Menu" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </button>
    <h1 id="title"></h1>
    <div class="sorts">
      <button type="button" id="az" class="on">A–Z</button>
      <button type="button" id="za">Z–A</button>
      <button type="button" id="find" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M15.2 15.2 L20.5 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </div>
  <div id="searchbar" hidden>
    <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
  </div>
</header>
<button type="button" id="scrim" hidden aria-label="Close menu"></button>
<aside id="drawer" aria-hidden="true" inert>
  <div class="drawer-top">
    <button type="button" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </button>
    <div class="drawer-brand">TOEIC answer keys</div>
  </div>
  <nav id="tree" aria-label="Contents"></nav>
  <footer>
    <div>Author: Nguyễn Minh Nghị</div>
    <div>Contact: nmnghi95@gmail.com</div>
  </footer>
</aside>
<main id="main"></main>
<script>
const menuBtn = document.getElementById("menu");
const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");
const tree = document.getElementById("tree");
const main = document.getElementById("main");
const titleEl = document.getElementById("title");
const az = document.getElementById("az");
const za = document.getElementById("za");
const findBtn = document.getElementById("find");
const searchbar = document.getElementById("searchbar");
const qInput = document.getElementById("q");

const cache = { listening: null, reading: null };
const pending = { listening: null, reading: null };
const loadError = { listening: "", reading: "" };
const prefixes = { listening: "l-", reading: "r-" };
const expanded = new Set();
const openItems = new Set();
const svgCache = new WeakMap();

let selection = null;
let dir = 1;
let query = "";
let searching = false;
let drawerOpen = false;
let listeningDetail = null;
let listeningPhase = "image";

function titlesOf(item) {
  return Array.isArray(item.fl) ? item.fl : [item.fl];
}

function pathText(item, level) {
  if (level === "name") return "";
  if (level === "sub") return item.name;
  if (level === "cat") return item["sub-cat"] + " - " + item.name;
  return item.cat + " - " + item["sub-cat"] + " - " + item.name;
}

function itemLabel(row, level) {
  return pathText(row.item, level) || (row.file || "").replace(/\.json$/i, "");
}

function answerItem() {
  if (!selection || selection.kind !== "listening" || query.trim()) return null;
  if (listeningDetail) return listeningDetail;
  if (selection.level === "name" && listeningPhase === "answers") {
    const rows = scopedRows("listening");
    return rows[0] ? rows[0].item : null;
  }
  return null;
}

function selectionTitle() {
  if (!selection) return "";
  const parts = [selection.kind === "listening" ? "Listening" : "Reading"];
  const detail = answerItem();
  if (detail) {
    parts.push(detail.cat, detail["sub-cat"], detail.name);
    return parts.join(" - ");
  }
  if (selection.cat) parts.push(selection.cat);
  if (selection.sub) parts.push(selection.sub);
  if (selection.name) parts.push(selection.name);
  return parts.join(" - ");
}

function applyTitle() {
  const text = selectionTitle();
  titleEl.textContent = text;
  document.title = text || "TOEIC answer keys";
}

function fileFromHref(href) {
  href = href || "";
  const hash = href.indexOf("#");
  if (hash >= 0) href = href.slice(0, hash);
  const query = href.indexOf("?");
  if (query >= 0) href = href.slice(0, query);
  try { href = decodeURIComponent(href); } catch (e) {}
  if (!href || href.includes("..")) return "";
  return href.split("/").filter(Boolean).pop() || "";
}

function namesIn(html, prefix) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const names = new Set();
  for (const link of doc.querySelectorAll("a[href]")) {
    const file = fileFromHref(link.getAttribute("href"));
    if (file.startsWith(prefix) && file.toLowerCase().endsWith(".json")) names.add(file);
  }
  return names;
}

const githubDirs = new Map();

function githubOwner() {
  const host = location.hostname.toLowerCase();
  const suffix = ".github.io";
  if (!host.endsWith(suffix) || host.length <= suffix.length) return "";
  return host.slice(0, -suffix.length);
}

function githubContents(owner, repo, path, ref) {
  const key = owner + "\n" + repo + "\n" + path + "\n" + ref;
  if (!githubDirs.has(key)) {
    let url = "https://api.github.com/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo) + "/contents";
    if (path) url += "/" + path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    if (ref) url += "?ref=" + encodeURIComponent(ref);
    githubDirs.set(key, fetch(url, {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    }).then(async (res) => {
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data) ? data : null;
    }).catch(() => null));
  }
  return githubDirs.get(key);
}

function sameSite(htmlUrl) {
  try {
    const published = new URL(htmlUrl);
    if (!published.pathname.endsWith("/")) published.pathname += "/";
    const page = new URL("./", location.href);
    return page.href === published.href || page.href.startsWith(published.href);
  } catch (e) {
    return false;
  }
}

function linkTarget(filePath, target) {
  const stack = filePath.split("/").filter(Boolean);
  stack.pop();
  for (const part of target.split("/")) {
    if (part === "..") stack.pop();
    else if (part && part !== ".") stack.push(part);
  }
  return stack.join("/");
}

function pagesSource(owner, repo) {
  const key = "pages\n" + owner + "\n" + repo;
  if (!githubDirs.has(key)) {
    githubDirs.set(key, fetch("https://api.github.com/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo) + "/pages", {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    }).then(async (res) => {
      if (!res.ok) return null;
      const data = await res.json();
      const source = data && data.source;
      if (!source) return null;
      return {
        branch: source.branch || "",
        path: source.path === "/docs" ? "docs" : "",
        url: data.html_url || ""
      };
    }).catch(() => null));
  }
  return githubDirs.get(key);
}

async function filesInTree(owner, repo, rootPath, ref, prefix, base) {
  const root = await githubContents(owner, repo, rootPath, ref);
  if (!root || !root.some((item) => item.type === "file" && item.name === "index.html")) return [];
  const found = new Map();
  const add = (name, path) => {
    if (!path || path.split("/").includes("..")) return;
    if (!name.startsWith(prefix) || !name.toLowerCase().endsWith(".json")) return;
    if (!found.has(name)) found.set(name, new URL(path, base).href);
  };
  for (const item of root) {
    if (item.type === "file") add(item.name, item.name);
  }
  for (const folder of ["json", "data"]) {
    const sub = await githubContents(owner, repo, [rootPath, folder].filter(Boolean).join("/"), ref);
    if (!sub) continue;
    for (const item of sub) {
      if (item.type === "file") add(item.name, folder + "/" + item.name);
      else if (item.type === "symlink" && item.target) add(item.name, linkTarget(folder + "/" + item.name, item.target));
    }
  }
  return [...found.entries()];
}

async function filesFromGithub(prefix) {
  const owner = githubOwner();
  if (!owner) return [];
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[parts.length - 1] === "index.html") parts.pop();
  const tries = [{ repo: owner + ".github.io", dir: parts.join("/") }];
  if (parts.length) tries.unshift({ repo: parts[0], dir: parts.slice(1).join("/") });
  const base = new URL("./", location.href);
  for (const attempt of tries) {
    const source = await pagesSource(owner, attempt.repo);
    if (source && !sameSite(source.url)) continue;
    const lookups = source
      ? [[source.branch, source.path]]
      : [["", ""], ["", "docs"], ["gh-pages", ""], ["gh-pages", "docs"]];
    for (const [ref, publish] of lookups) {
      const files = await filesInTree(owner, attempt.repo, [attempt.dir, publish].filter(Boolean).join("/"), ref, prefix, base);
      if (files.length) return files;
    }
  }
  return [];
}

async function loadKind(kind) {
  const prefix = prefixes[kind];
  const found = new Map();
  if (!githubOwner()) {
    const dirs = [new URL("./", location.href), new URL("data/", location.href)];
    for (const dir of dirs) {
      let res;
      try { res = await fetch(dir.href, { cache: "no-store" }); }
      catch (e) { continue; }
      if (!res.ok) continue;
      for (const name of namesIn(await res.text(), prefix)) {
        if (!found.has(name)) found.set(name, new URL(name, dir).href);
      }
    }
  }
  if (!found.size) {
    for (const [name, url] of await filesFromGithub(prefix)) found.set(name, url);
  }
  const files = [...found.entries()].sort((a, b) =>
    a[0].localeCompare(b[0], "en", { numeric: true, sensitivity: "base" })
  );
  if (!files.length) throw new Error("empty");
  const groups = await Promise.all(files.map(async ([name, url]) => {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(name);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(name);
    return data.map((item) => ({ item, file: name }));
  }));
  const flat = [];
  for (const group of groups) {
    for (const row of group) flat.push({ item: row.item, file: row.file, i: flat.length });
  }
  return flat;
}

function ensure(kind) {
  if (cache[kind]) return Promise.resolve(cache[kind]);
  if (pending[kind]) return pending[kind];
  pending[kind] = loadKind(kind).then((data) => {
    cache[kind] = data;
    loadError[kind] = "";
    return data;
  }).catch(() => {
    pending[kind] = null;
    loadError[kind] = "No data found";
    return null;
  });
  return pending[kind];
}

function groupsOf(rows) {
  const cats = [];
  const catMap = new Map();
  for (const row of rows || []) {
    const item = row.item;
    let cat = catMap.get(item.cat);
    if (!cat) {
      cat = { key: item.cat, subs: [], subMap: new Map() };
      catMap.set(item.cat, cat);
      cats.push(cat);
    }
    let sub = cat.subMap.get(item["sub-cat"]);
    if (!sub) {
      sub = { key: item["sub-cat"], names: [], seen: new Set() };
      cat.subMap.set(item["sub-cat"], sub);
      cat.subs.push(sub);
    }
    if (!sub.seen.has(item.name)) {
      sub.seen.add(item.name);
      sub.names.push(item.name);
    }
  }
  return cats;
}

function keyFor(kind, cat, sub) {
  let key = kind;
  if (cat) key += "/" + cat;
  if (sub) key += "/" + sub;
  return key;
}

function isSelected(kind, level, cat, sub, name) {
  if (!selection || selection.kind !== kind || selection.level !== level) return false;
  if (level === "root") return true;
  if (selection.cat !== cat) return false;
  if (level === "cat") return true;
  if (selection.sub !== sub) return false;
  if (level === "sub") return true;
  return selection.name === name;
}

function makeRow(label, branch, isOpen, selected) {
  const row = document.createElement("button");
  row.type = "button";
  row.className = "row" + (selected ? " sel" : "");
  if (branch) {
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = isOpen ? "\u25BE" : "\u25B8";
    row.appendChild(chev);
    row.setAttribute("aria-expanded", isOpen ? "true" : "false");
  } else {
    const slot = document.createElement("span");
    slot.className = "slot";
    row.appendChild(slot);
  }
  const text = document.createElement("span");
  text.className = "label";
  text.textContent = label;
  if (selected) row.setAttribute("aria-current", "true");
  row.appendChild(text);
  return row;
}

function renderTree() {
  tree.replaceChildren();
  tree.append(sectionNode("listening", "Listening"), sectionNode("reading", "Reading (Part 7)"));
}

function sectionNode(kind, label) {
  const wrap = document.createElement("div");
  const key = kind;
  const isOpen = expanded.has(key);
  const row = makeRow(label, true, isOpen, isSelected(kind, "root"));
  row.addEventListener("click", () => onBranchRow(key, kind, "root"));
  wrap.appendChild(row);
  if (!isOpen) return wrap;
  const kids = document.createElement("div");
  kids.className = "kids";
  const rows = cache[kind];
  if (!rows) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = loadError[kind] || "Loading…";
    kids.appendChild(note);
  } else {
    for (const cat of groupsOf(rows)) kids.appendChild(catNode(kind, cat));
  }
  wrap.appendChild(kids);
  return wrap;
}

function catNode(kind, cat) {
  const wrap = document.createElement("div");
  const key = keyFor(kind, cat.key);
  const isOpen = expanded.has(key);
  const row = makeRow(cat.key, true, isOpen, isSelected(kind, "cat", cat.key));
  row.addEventListener("click", () => onBranchRow(key, kind, "cat", cat.key));
  wrap.appendChild(row);
  if (!isOpen) return wrap;
  const kids = document.createElement("div");
  kids.className = "kids";
  for (const sub of cat.subs) kids.appendChild(subNode(kind, cat.key, sub));
  wrap.appendChild(kids);
  return wrap;
}

function subNode(kind, catKey, sub) {
  const wrap = document.createElement("div");
  const key = keyFor(kind, catKey, sub.key);
  const isOpen = expanded.has(key);
  const row = makeRow(sub.key, true, isOpen, isSelected(kind, "sub", catKey, sub.key));
  row.addEventListener("click", () => onBranchRow(key, kind, "sub", catKey, sub.key));
  wrap.appendChild(row);
  if (!isOpen) return wrap;
  const kids = document.createElement("div");
  kids.className = "kids";
  for (const name of sub.names) {
    const nameRow = makeRow(name, false, false, isSelected(kind, "name", catKey, sub.key, name));
    nameRow.addEventListener("click", () => selectName(kind, catKey, sub.key, name));
    kids.appendChild(nameRow);
  }
  wrap.appendChild(kids);
  return wrap;
}

function collapseKey(key) {
  for (const item of [...expanded]) {
    if (item === key || item.startsWith(key + "/")) expanded.delete(item);
  }
  renderTree();
}

function onBranchRow(key, kind, level, cat, sub) {
  if (expanded.has(key)) {
    collapseKey(key);
    selection = { kind, level, cat: cat || null, sub: sub || null, name: null };
    resetDetail();
    applyTitle();
    renderTree();
    renderMain();
    if (!cache[kind]) ensure(kind).then(() => { renderTree(); renderMain(); });
    return;
  }
  selectBranch(kind, level, cat, sub);
}

function resetDetail() {
  listeningDetail = null;
  listeningPhase = "image";
}

function selectBranch(kind, level, cat, sub) {
  expanded.add(kind);
  if (cat) expanded.add(keyFor(kind, cat));
  if (sub) expanded.add(keyFor(kind, cat, sub));
  selection = { kind, level, cat: cat || null, sub: sub || null, name: null };
  resetDetail();
  applyTitle();
  renderTree();
  renderMain();
  ensure(kind).then(() => {
    renderTree();
    renderMain();
  });
}

function selectName(kind, cat, sub, name) {
  expanded.add(kind);
  expanded.add(keyFor(kind, cat));
  expanded.add(keyFor(kind, cat, sub));
  selection = { kind, level: "name", cat, sub, name };
  resetDetail();
  applyTitle();
  closeDrawer();
  const paint = () => {
    renderTree();
    renderMain();
    window.scrollTo(0, 0);
  };
  if (cache[kind]) paint();
  else ensure(kind).then(paint);
}

function scopedRows(kind) {
  const rows = cache[kind] || [];
  if (!selection || selection.kind !== kind) return [];
  return rows.filter(({ item }) => {
    if (selection.level === "root") return true;
    if (item.cat !== selection.cat) return false;
    if (selection.level === "cat") return true;
    if (item["sub-cat"] !== selection.sub) return false;
    if (selection.level === "sub") return true;
    return item.name === selection.name;
  });
}

function sorted(rows, labelOf, numeric) {
  const options = numeric ? { sensitivity: "base", numeric: true } : { sensitivity: "base" };
  return rows.slice().sort((a, b) => dir * labelOf(a).localeCompare(labelOf(b), "en", options));
}

function syncHeaderHeight() {
  document.documentElement.style.setProperty("--header-h", document.querySelector("header").offsetHeight + "px");
}

function svgNode(item) {
  let tmpl = svgCache.get(item);
  if (!tmpl) {
    tmpl = new DOMParser().parseFromString(item.first_img.svg, "image/svg+xml").documentElement;
    svgCache.set(item, tmpl);
  }
  const node = tmpl.cloneNode(true);
  node.removeAttribute("width");
  node.removeAttribute("height");
  return node;
}

function renderMain() {
  syncHeaderHeight();
  applyTitle();
  const q = query.trim().toLocaleLowerCase("en");
  if (q) {
    renderReading(cache.reading || [], "search", q);
    return;
  }
  if (!selection) {
    main.className = "";
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Open the menu to choose Listening or Reading.";
    main.replaceChildren(hint);
    return;
  }
  if (!cache[selection.kind]) {
    main.className = "";
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = loadError[selection.kind] || "Loading…";
    main.replaceChildren(hint);
    return;
  }
  if (selection.kind === "listening") renderListening();
  else renderReading(scopedRows("reading"), selection.level, "");
}

function renderListening() {
  const rows = scopedRows("listening");
  if (selection.level === "name" && rows.length === 1) {
    const row = rows[0];
    if (!row) {
      main.className = "";
      main.replaceChildren();
      return;
    }
    if (listeningPhase === "answers") renderAnswers(row.item, () => { listeningPhase = "image"; renderMain(); });
    else renderHero(row.item);
    return;
  }
  if (listeningDetail) {
    renderAnswers(listeningDetail, () => { listeningDetail = null; renderMain(); });
    return;
  }
  renderGrid(rows);
}

function renderHero(item) {
  main.className = "";
  const wrap = document.createElement("div");
  wrap.className = "hero-wrap";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "hero";
  btn.setAttribute("aria-label", "View 100 answers");
  btn.appendChild(svgNode(item));
  btn.addEventListener("click", () => {
    listeningPhase = "answers";
    renderMain();
    window.scrollTo(0, 0);
  });
  const hint = document.createElement("p");
  hint.className = "tap-hint";
  hint.textContent = "Tap the image to view 100 answers";
  wrap.append(btn, hint);
  main.replaceChildren(wrap);
}

function renderGrid(rows) {
  main.className = "wide";
  const level = selection.level;
  const ordered = sorted(rows, (row) => itemLabel(row, level), true);
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const row of ordered) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    const thumb = document.createElement("span");
    thumb.className = "thumb";
    thumb.appendChild(svgNode(row.item));
    const label = document.createElement("span");
    label.className = "card-label";
    label.textContent = itemLabel(row, level);
    btn.append(thumb, label);
    btn.addEventListener("click", () => {
      listeningDetail = row.item;
      renderMain();
      window.scrollTo(0, 0);
    });
    grid.appendChild(btn);
  }
  main.replaceChildren(grid);
}

function renderAnswers(item, onBack) {
  main.className = "wide";
  const bar = document.createElement("div");
  bar.className = "backbar";
  const back = document.createElement("button");
  back.type = "button";
  back.className = "back";
  back.textContent = "\u2190 Back";
  back.addEventListener("click", () => {
    onBack();
    window.scrollTo(0, 0);
  });
  bar.appendChild(back);
  const sheet = document.createElement("div");
  sheet.className = "answers";
  item.keys.forEach((value, index) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(index + 1);
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = value;
    cell.append(num, letter);
    sheet.appendChild(cell);
  });
  main.replaceChildren(bar, sheet);
}

function renderReading(rows, level, q) {
  main.className = "";
  const list = document.createElement("ul");
  list.id = "list";
  let view = rows;
  if (q) {
    view = rows.filter(({ item }) =>
      titlesOf(item).concat(item.keys).join("\n").toLocaleLowerCase("en").includes(q)
    );
  }
  view = sorted(view, (row) => titlesOf(row.item)[0] || "");
  if (!view.length) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = q ? "No results" : "No passages.";
    list.appendChild(empty);
    main.replaceChildren(list);
    return;
  }
  for (const row of view) {
    const item = row.item;
    const titles = titlesOf(item);
    const li = document.createElement("li");
    const opened = openItems.has(row.i);
    if (opened) li.className = "open";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "head";
    btn.setAttribute("aria-expanded", opened ? "true" : "false");
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = titles[0] || "";
    btn.appendChild(title);
    const path = pathText(item, level);
    if (path) {
      const note = document.createElement("span");
      note.className = "path";
      note.textContent = path;
      btn.appendChild(note);
    }
    const body = document.createElement("div");
    body.className = "body";
    for (let k = 1; k < titles.length; k++) {
      const extra = document.createElement("div");
      extra.className = "extra";
      extra.textContent = titles[k];
      body.appendChild(extra);
    }
    const answers = document.createElement("ul");
    answers.className = "ans";
    for (const ans of item.keys) {
      const line = document.createElement("li");
      line.textContent = ans;
      answers.appendChild(line);
    }
    body.appendChild(answers);
    btn.addEventListener("click", () => {
      if (openItems.has(row.i)) openItems.delete(row.i);
      else openItems.add(row.i);
      const now = openItems.has(row.i);
      li.classList.toggle("open", now);
      btn.setAttribute("aria-expanded", now ? "true" : "false");
    });
    li.append(btn, body);
    list.appendChild(li);
  }
  main.replaceChildren(list);
}

function setDir(next) {
  dir = next;
  az.classList.toggle("on", dir === 1);
  za.classList.toggle("on", dir === -1);
  renderMain();
}

function openDrawer() {
  drawerOpen = true;
  drawer.inert = false;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  scrim.hidden = false;
  menuBtn.setAttribute("aria-expanded", "true");
  renderTree();
}

function closeDrawer() {
  drawerOpen = false;
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  drawer.inert = true;
  scrim.hidden = true;
  menuBtn.setAttribute("aria-expanded", "false");
}

function openSearch() {
  searching = true;
  searchbar.hidden = false;
  findBtn.classList.add("on");
  findBtn.setAttribute("aria-expanded", "true");
  syncHeaderHeight();
  qInput.focus();
}

function closeSearch() {
  qInput.blur();
  searching = false;
  searchbar.hidden = true;
  findBtn.classList.remove("on");
  findBtn.setAttribute("aria-expanded", "false");
  if (qInput.value) {
    qInput.value = "";
    query = "";
    renderMain();
  }
  syncHeaderHeight();
}

menuBtn.addEventListener("click", () => {
  if (drawerOpen) closeDrawer();
  else openDrawer();
});
document.getElementById("close").addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && drawerOpen) closeDrawer();
});
az.addEventListener("click", () => setDir(1));
za.addEventListener("click", () => setDir(-1));
findBtn.addEventListener("pointerdown", (event) => {
  if (searching) event.preventDefault();
});
findBtn.addEventListener("click", () => {
  if (searching) closeSearch();
  else openSearch();
});
qInput.addEventListener("input", () => {
  query = qInput.value;
  if (query.trim() && !cache.reading) ensure("reading").then(() => renderMain());
  else renderMain();
});

renderTree();
renderMain();
</script>
</body>
</html>
